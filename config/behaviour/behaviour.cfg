interface Node (enumRef='behaviour.nodeenum', pack, defaultImp='ActWaitTimeMs') {
	struct ActWaitTimeMs { // ActWaitTimeMs
		timeMs:ExpNumber;
	}

	struct ActWaitRandomTimeMs { // ActWaitRandomTimeMs
		minTimeMs:int;
		maxTimeMs:int;
	}

	struct DecSuccess { // DecSuccess
		validOnFinish:bool;
		node:Node (pack);
		note:str;
	}

	struct DecFailure { // DecFailure
		validOnFinish:bool;
		node:Node (pack);
		note:str;
	}

	struct DecNot { // DecNot
		validOnFinish:bool;
		node:Node;
		note:str;
	}

	struct DecLog { // DecLog
		validOnFinish:bool;
		node:Node;
		msg:str;
	}

	struct DecLoop { // DecLoop
		validOnFinish:bool;
		node:Node;
		loopNum:int;
		note:str;
	}

	struct DecLoopUtil { // DecLoopUtil
		validOnFinish:bool;
		cond:Condition;
		node:Node;
		note:str;
	}

	struct DecTimed { // DecTimed
		validOnFinish:bool;
		timeMs:ExpNumber;
		node:Node;
		note:str;
	}

	struct DecCondition { // 前置条件装饰器：条件失效时中断被装饰节点
		cond:Condition;
		node:Node (pack);
		note:str;
	}

	struct CompSequence { // CompSequence
		precond:Condition;
		nodes:list<Node> (pack);
		enterActions:list<Node> (pack);
		cleanActions:list<Node> (pack);
		note:str;
	}

	struct CompSelector { // CompSelector
		precond:Condition;
		nodes:list<Node> (pack);
		enterActions:list<Node> (pack);
		cleanActions:list<Node> (pack);
		note:str;
	}

	struct CompParallel { // CompParallel
		oneSuccAllSucc:bool;
		oneFailAllFail:bool;
		nodes:list<Node> (pack);
		enterActions:list<Node> (pack);
		cleanActions:list<Node> (pack);
		note:str;
	}

	struct CompIntSwitchCase { // CompIntSwitchCase
		precond:Condition;
		caseValue:ExpNumber;
		defaultCase:Node (pack);
		cases:list<IntSwitchNode> (pack);
		enterActions:list<Node> (pack);
		cleanActions:list<Node> (pack);
		note:str;
	}

	struct CompWeightSelector { // CompWeightSelector
		precond:Condition;
		weightNodes:list<WeightNode> (pack);
		enterActions:list<Node> (pack);
		cleanActions:list<Node> (pack);
		note:str;
	}

	struct CompCondWeightSelector { // CompWeightSelector
		precond:Condition;
		weightNodes:list<CondWeightNode> (pack);
		enterActions:list<Node> (pack);
		cleanActions:list<Node> (pack);
		note:str;
	}

	struct CompParamWeightSelector { // CompParamWeightSelector
		precond:Condition;
		weightNodes:list<ParamWeightNode> (pack);
		enterActions:list<Node> (pack);
		cleanActions:list<Node> (pack);
		note:str;
	}

	struct CompRepeatUtil { // CompRepeatUtil 不允许返回running
		cond:Condition; // 无论node返回Success/failure, 只要cond为true, 就在一帧内, 继续执行node, node不允许返回Running
		node:Node (pack);
	}

	struct SubTree { // SubTree
		subTreeId:int ->behaviour;
		paramBBKeys:list<str> (pack);
		returnValueBBKey:str;
		note:str;
	}

	struct ActDebugMsg { // ActDebugMsg
		msg:ExpStr;
		params:list<ExpStr> (pack);
	}

	struct ActCondition { // ActCondition
		cond:Condition;
		note:str;
	}

	struct ActReturnStatus { // ActReturnStatus
		status:int ->statusenum;
		note:str;
	}

	struct ActSetBBNumber { // ActSetBBNumber
		bbKey:str;
		value:ExpNumber;
		note:str;
	}

	struct ActSetBBNumberIfNull { // ActSetBBNumberIfNull
		bbKey:str;
		value:ExpNumber;
		note:str;
	}

	struct ActSetBBObj { // ActSetBBObj
		bbKey:str;
		value:ExpObj;
		note:str;
	}

	struct ActSetBBStr { // ActSetBBStr
		bbKey:str;
		value:ExpStr;
		note:str;
	}

	struct ActSetBBVector3 { // ActSetBBVector3
		bbKey:str;
		value:ExpVector3;
		note:str;
	}

	struct ActWalkToPos { // ActWalkToPos
		pos:ExpVector3;
		note:str;
	}

	struct ActWalkToPosWithDir { // ActWalkToPosWithDir
		pos:ExpVector3;
		dir:ExpNumber;
		note:str;
	}

	struct ActMoveStop { // ActMoveStop
		entity:ExpObj;
	}

	struct ActChangeDir { // ActChangeDir
		entity:ExpObj;
		dir:ExpNumber;
	}

	struct ActFaceToEntity { // ActFaceToEntity
		entity:ExpObj;
	}

	struct ActInteractionEnter { // ActInteractionEnter
		entity:ExpObj;
		abilityId:ExpNumber;
		interactionId:ExpNumber;
		dataInteractionId:ExpNumber;
		note:str;
	}

	struct ActInteractionExit { // ActInteractionEnter
		entity:ExpObj;
		abilityId:ExpNumber;
		interactionId:ExpNumber;
		dataInteractionId:ExpNumber;
		note:str;
	}

	struct ActFindNonePlayerEntity {
		objType:int; // 不要填Role类型
		cfgIdList:list<int> (pack); // 配置id列表
		radius:float; // 半径
		wbbKeyEntity:str; // wbbKeyMineEntity
	}

	struct ActFindSummonOwner { // ActFindSummonOwner
		radius:float;
		wbbKey:str;
	}
}

interface Condition (enumRef='behaviour.conditionenum', pack, defaultImp='NULL') {
	struct NULL { // NULL
	}

	struct Success { // Success
	}

	struct Failure { // Failure
	}

	struct Compare { // Compare
		left:ExpNumber;
		right:ExpNumber;
		comarator:int ->compareenum;
	}

	struct StrEqual { // StrEqual
		left:ExpStr;
		right:ExpStr;
	}

	struct ObjEqual { // ObjEqual
		left:ExpObj;
		right:ExpObj;
	}

	struct Not { // Not
		cond:Condition;
	}

	struct And { // And
		cond1:Condition;
		cond2:Condition;
	}

	struct Or { // Or
		cond1:Condition;
		cond2:Condition;
	}

	struct IsEntityDestroyed { // IsEntityDestroyed
		entity:ExpObj;
	}

	struct checkIsInInteraction { // 检查self是否在和entity的交互中
		entity:ExpObj; // 被操作的对象, 比如家具
		abilityId:ExpNumber; // abilityId
		interactionId:ExpNumber; // interactionDataId
	}
}

interface ExpNumber (enumRef='behaviour.expnumberenum', pack, defaultImp='ConstInteger') {
	struct ConstInteger { // ConstInteger
		value:int;
	}

	struct ConstFloat { // ConstFloat
		value:float;
	}

	struct ConstLong { // ConstLong
		value:long;
	}

	struct getBBNumber { // getBBNumber
		bbKey:str;
	}

	struct RandInteger { // RandInteger
		min:int;
		max:int;
	}

	struct Calculate { // Calculate
		left:ExpNumber;
		right:ExpNumber;
		calculator:int ->calculatorenum;
	}

	struct Max { // Max
		left:ExpNumber;
		right:ExpNumber;
	}

	struct Min { // Min
		left:ExpNumber;
		right:ExpNumber;
	}

	struct GetInstanceId {
		entity:ExpObj;
	}

	struct GetCurrentTimeMills { // GetCurrentTimeMills
	}

	struct CalcDist { // CalcDist
		left:ExpVector3;
		right:ExpVector3;
	}
}

interface ExpStr (enumRef='behaviour.expstrenum', defaultImp='Const') {
	struct Const { // Const
		value:str;
	}

	struct GetBBStr { // GetBBStr
		bbKey:str;
	}

	struct ToStringForNumber { // ToStringForNumber
		num:ExpNumber;
	}

	struct ToIntStringForNumber { // ToIntStringForNumber
		num:ExpNumber;
	}

	struct ToLongStringForNumber { // ToLongStringForNumber
		num:ExpNumber;
	}

	struct ToFloatStringForNumber { // ToFloatStringForNumber
		num:ExpNumber;
	}

	struct ToDoubleStringForNumber { // ToDoubleStringForNumber
		num:ExpNumber;
	}

	struct ToStringForVector3 { // ToStringForVector3
		v3:ExpVector3;
	}
}

interface ExpVector3 (enumRef='behaviour.expvector3enum', defaultImp='Const') {
	struct Const { // Const
		x:float;
		y:float;
		z:float;
	}

	struct GetBBVector3 { // GetBBVector3
		bbKey:str;
	}

	struct GetPos { // GetPos
		entity:ExpObj;
	}

	struct GetPosListenMove { // GetPosListenMove
		entity:ExpObj;
	}
}

interface ExpObj (enumRef='behaviour.expobjenum', defaultImp='GetEntitySelf') {
	struct GetEntitySelf { // GetEntitySelf
	}

	struct ObjNull { // ObjNull
	}

	struct GetBBEntity { // GetBBEntity
		bbKey:str;
	}

	struct GetEntityByInstId { // GetEntityByInstId
		instId:ExpNumber;
	}

	struct GetBBObj { // GetBBObj
		bbKey:str;
	}

	struct ConstBoolean { // ConstBoolean
		value:bool;
	}
}

struct IntSwitchNode { // IntSwitchNode
	caseInt:int;
	node:Node;
	note:str;
}

struct CondWeightNode { // CondWeightNode
	cond:Condition;
	weight:int;
	node:Node;
}

struct WeightNode { // WeightNode
	weight:int;
	node:Node;
}

struct ParamWeightNode { // ParamWeightNode
	weight:ExpNumber;
	node:Node;
}

struct BBParam {
	bbType:int ->typeenum;
	bbKey:str;
}

table behaviour[id] (json) {
	id:int;
	name:str; // 行为树名
	objType:int;
	debug:bool;
	params:list<BBParam> (pack); // 参数
	returnValue:BBParam (pack); // 返回值
	node:Node (pack); // 节点
	note:str;
}

table compareenum[id] (enum='ename') {
	id:int;
	ename:str; // 枚举名
}

table calculatorenum[id] (enum='ename') {
	id:int;
	ename:str; // 枚举名
}

table statusenum[id] (enum='ename') {
	id:int;
	ename:str; // 枚举名
}

table conditionenum[id] (enum='ename') {
	id:int;
	ename:str; // 枚举名
}

table expnumberenum[id] (enum='ename') {
	id:int;
	ename:str; // 枚举名
}

table expstrenum[id] (enum='ename') {
	id:int;
	ename:str; // 枚举名
}

table expobjenum[id] (enum='ename') {
	id:int;
	ename:str; // 枚举名
}

table nodeenum[id] (enum='ename') {
	id:int;
	ename:str; // 枚举名
	nodeType:int ->nodetypeenum; // 节点类型(编辑器显示使用,不参与逻辑)
}

table nodetypeenum[id] (enum='ename') {
	id:int;
	ename:str; // 枚举名
}

table typeenum[id] {
	id:int;
	ename:str; // 枚举名
}

table expvector3enum[id] (enum='ename') {
	id:int;
	ename:str; // 枚举名
}
